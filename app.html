<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MeringoDocs</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:0;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#111;
}

p{
    text-align:center;
    color:#666;
}

textarea{
    width:100%;
    height:180px;
    padding:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    resize:none;
    margin-top:20px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background:#111;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#333;
}

.output{
    margin-top:30px;
    padding:20px;
    background:#fafafa;
    border-radius:8px;
    border:1px solid #ddd;
    white-space:pre-wrap;
    line-height:1.7;
    min-height:150px;
}

</style>

</head>

<body>

<div class="container">

<h1>MeringoDocs</h1>

<p>
AI-powered writing assistant for students and professionals
</p>

<textarea 
id="prompt" 
placeholder="Type what you want MeringoDocs to write for you...">
</textarea>

<button onclick="generateText()">
Generate Content
</button>

<div class="output" id="output">
Your generated content will appear here...
</div>

</div>

<script>

async function generateText() {

    const prompt = document.getElementById("prompt").value;

    const output = document.getElementById("output");

    if(prompt.trim() === ""){

        alert("Please enter a prompt");

        return;
    }

    output.innerHTML = "Generating content...";

    try{

        const response = await fetch(
            "https://meringodocs-api.oyinlanadj.workers.dev/",
            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    model:"claude-3-haiku-20240307",

                    max_tokens:1200,

                    messages:[
                        {
                            role:"user",
                            content:prompt
                        }
                    ]

                })

            }
        );

        const data = await response.json();

        console.log(data);

        if(data.error){

            output.innerHTML = "Error: " + data.error;

            return;
        }

        if(
            data.content &&
            data.content[0] &&
            data.content[0].text
        ){

            output.innerHTML = data.content[0].text;

        }else{

            output.innerHTML = "No response generated.";

        }

    }catch(error){

        console.log(error);

        output.innerHTML = "Something went wrong.";

    }

}

</script>

</body>
</html>
